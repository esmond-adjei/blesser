# Web app and reverse proxy (used in the full-stack compose).
#
# Same-origin mode: build with VITE_API_URL empty so the browser calls /api
# and /ready on this host, and nginx forwards them to the api service. With
# VITE_API_URL set to the API origin, the browser calls the API directly (CORS).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /ready {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Push service worker: always revalidated, so a new version reaches browsers
    # on their next visit instead of after a cache TTL.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
