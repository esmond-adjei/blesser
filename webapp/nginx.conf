# Webapp reverse-proxy (used in full-stack compose).
#
# Same-origin mode: build with VITE_API_URL empty so the browser calls
# /api, /health, /ready on this host, and nginx forwards them to the
# api service over the compose network. Static deploy mode (VITE_API_URL
# set to the api origin) bypasses these locations entirely — the browser
# calls the api directly via CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Server-sent events (the live run feed). This needs its own location:
    # with nginx defaults the feed is broken in this deploy and works only
    # behind the Vite dev proxy, which is exactly the "live updates don't
    # arrive in production" symptom.
    #
    #   proxy_buffering off   - on (the default) nginx accumulates the
    #                           response before forwarding, so the small
    #                           event frames sit in a buffer instead of
    #                           reaching the browser.
    #   proxy_http_version    - 1.0 (the default upstream version) has no
    #                           chunked transfer encoding and sends
    #                           Connection: close.
    #   proxy_read_timeout    - the default 60s kills an idle stream; the
    #                           feed is deliberately quiet between events.
    #   gzip off              - compression buffers to fill a window.
    location ~ ^/api/runs/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
        gzip off;
    }

    # API + probes -> backend service. Fails closed (502) when api is down;
    # the static UI itself keeps serving.
    location /api/ {
        # nginx's 1 MB default rejected ordinary CVs with a photo. The API
        # enforces its own per-route limits (10 MB CV, 5 MB avatar, 2 MB
        # JSON); this only has to admit the largest of them.
        client_max_body_size 12m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Push service worker (#196): always revalidated, so a new version
    # reaches browsers on their next visit instead of after a cache TTL.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
