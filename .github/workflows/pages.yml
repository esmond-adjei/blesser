# Deploys the marketing site (website/) to GitHub Pages.
#
# The site is a static Astro build, so this is the whole pipeline: build,
# upload the artifact, publish. The app is deployed separately (see
# docs/deployment.md).
name: Deploy marketing site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "webapp/src/legal/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 7 needs Node >= 22.23.4.
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A custom domain needs a CNAME next to the build. The domain comes
      # from a repository variable, so it is never hard-coded here.
      - name: Write CNAME
        if: vars.PAGES_DOMAIN != ''
        run: echo "${{ vars.PAGES_DOMAIN }}" > public/CNAME

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
          # A project site lives on a subpath (/<repo>); a custom domain
          # serves from the root. Set PAGES_BASE_PATH to "/" for the latter.
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/graduator' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
