name: Images

# Pushing to deploy runs the CI checks, then builds and pushes every image to Docker Hub.
# Needs secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. Optional variables:
# DOCKERHUB_NAMESPACE (defaults to the username), VITE_API_URL, VITE_SITE_URL.
on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
            dockerfile: api/Dockerfile
          - name: webapp
            context: .
            dockerfile: webapp/Dockerfile
          - name: admin
            context: .
            dockerfile: admin/Dockerfile
          - name: site
            context: .
            dockerfile: site/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/blesser-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SITE_URL=${{ vars.VITE_SITE_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
