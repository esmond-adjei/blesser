name: CI

# Mirrors `make verify` (lint + tests + build). Pyright and ruff-format are not
# gates, as in the Makefile.
on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Ephemeral test database. Trust auth on purpose: there is no real
      # credential here, so there is nothing to leak -- and secret scanners
      # stay quiet. The container lives only for the duration of the job.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blesser
          POSTGRES_DB: blesser
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blesser -d blesser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://blesser@localhost:5432/blesser_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Oxlint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
