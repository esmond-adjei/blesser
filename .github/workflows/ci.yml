name: CI

# Mirrors `make verify` (lint + test + build). Pyright and ruff-format are
# intentionally not gates here either: both carry pre-existing debt that the
# Makefile documents, so CI enforces exactly what local `make verify` does.
on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Ephemeral test database. Trust auth on purpose: there is no real
      # credential here, so there is nothing to leak -- and secret scanners
      # stay quiet. The container lives only for the duration of the job.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: graduator
          POSTGRES_DB: graduator
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graduator -d graduator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://graduator@localhost:5432/graduator_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Design system copy is current
        run: node ../docs/design-system/sync.mjs --check

      - name: Install dependencies
        run: npm ci

      - name: Oxlint
        run: npm run lint

      - name: Production build
        run: npm run build

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 7 needs Node >= 22.23.4.
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Design system copy is current
        run: node ../docs/design-system/sync.mjs --check

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Production build
        run: npm run build
