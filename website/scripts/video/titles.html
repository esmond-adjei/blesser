<!doctype html>
<!--
  The film's title cards and crossfades. build-video.mjs calls title(t, card)
  or blend(a, b, k) and screenshots the result; nothing animates on its own.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../src/styles/design-system/fonts.css" />
    <link rel="stylesheet" href="../../src/styles/design-system/tokens.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1440px; height: 810px; overflow: hidden; background: var(--canvas); }
      body { font-family: var(--font-sans); color: var(--label); -webkit-font-smoothing: antialiased; }
      #card { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 28px; }
      #card[hidden], .layer[hidden] { display: none; }
      .brand.w { display: flex; align-items: center; gap: 14px; font: 700 28px/1 var(--font-sans); letter-spacing: -0.02em; }
      .brand img { width: 52px; height: 52px; }
      h1 { font: 600 72px/1.06 var(--font-sans); letter-spacing: -0.035em; max-width: 1100px; }
      h1 .soft { color: var(--label-tertiary); }
      .w { display: inline-block; }
      .sub { font: 400 24px/1.4 var(--font-sans); color: var(--label-secondary); }
      .cta { display: inline-flex; align-items: center; height: 56px; padding: 0 30px; border-radius: 999px; background: var(--tint); color: #fff; font: 600 20px/1 var(--font-sans); }
      .layer { position: absolute; inset: 0; width: 1440px; height: 810px; }
    </style>
  </head>
  <body>
    <div id="card" hidden></div>
    <img id="a" class="layer" alt="" hidden />
    <img id="b" class="layer" alt="" hidden />
    <script>
      const card = document.getElementById("card")
      const a = document.getElementById("a")
      const b = document.getElementById("b")
      const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3)

      const CARDS = {
        open: `<h1><span class="w">Find</span> <span class="w">the</span> <span class="w">professors</span><br /><span class="w soft">who</span> <span class="w soft">fit</span> <span class="w soft">your</span> <span class="w soft">research.</span></h1>`,
        close: `<div class="brand w"><img src="../../public/favicon.svg" alt="" />Graduator</div>
          <h1><span class="w">Your</span> <span class="w">shortlist,</span> <span class="w soft">with</span> <span class="w soft">the</span> <span class="w soft">evidence.</span></h1>
          <p class="sub w">Research the professors. Write to the right ones.</p>
          <span class="cta w">Start free</span>`,
      }
      let shown = ""

      window.title = (t, name) => {
        a.hidden = b.hidden = true
        card.hidden = false
        if (shown !== name) {
          card.innerHTML = CARDS[name]
          shown = name
        }
        card.querySelectorAll(".w").forEach((el, i) => {
          const k = ease((t - 0.15 - i * 0.09) / 0.5)
          el.style.opacity = k
          el.style.transform = `translateY(${(1 - k) * 18}px)`
        })
      }

      const load = (img, src) =>
        img.getAttribute("src") === src ? Promise.resolve() : ((img.src = src), img.decode())

      window.blend = async (from, to, k) => {
        card.hidden = true
        a.hidden = b.hidden = false
        await Promise.all([load(a, from), load(b, to)])
        b.style.opacity = k
      }
    </script>
  </body>
</html>
