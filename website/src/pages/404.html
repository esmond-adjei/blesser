---
import Base from "../layouts/Base.astro"
import { path } from "../lib/site"

const description = "That page is not here."
---

<Base title="Page not found" description={description} route="/404" noIndex>
  <section class="mx-auto max-w-2xl px-4 py-24 text-center sm:px-6">
    <h1 class="text-4xl font-bold tracking-tight">That page is not here</h1>
    <p class="mt-4 text-lg text-muted-foreground">
      The link you followed does not exist. Gradis checked twice.
    </p>
    <div class="mt-8 flex justify-center gap-3">
      <a
        href={path("/")}
        class="g-btn g-btn--primary g-btn--capsule"
      >
        Back to the start
      </a>
      <a
        href={path("/faq")}
        class="g-btn g-btn--outline g-btn--capsule"
      >
        Read the FAQ
      </a>
    </div>
  </section>
</Base>
