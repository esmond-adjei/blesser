# Blesser compose.
#
# Full local stack:   docker compose up -d --build db api worker webapp
# Backend only:        docker compose up -d --build db api worker
# Scale workers:       docker compose up -d --scale worker=3
#
#   api / worker  api/Dockerfile    (one image; the command decides the role)
#   webapp        webapp/Dockerfile (VITE_API_URL baked in via build arg)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blesser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blesser}
      POSTGRES_DB: ${POSTGRES_DB:-blesser}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blesser} -d ${POSTGRES_DB:-blesser}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./api/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-blesser}:${POSTGRES_PASSWORD:-blesser}@db:5432/${POSTGRES_DB:-blesser}}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      # Loopback only by default: browsers reach the api through the webapp's
      # nginx (/api). Set API_BIND=0.0.0.0 for split-origin deploys behind TLS.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./api/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-blesser}:${POSTGRES_PASSWORD:-blesser}@db:5432/${POSTGRES_DB:-blesser}}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "api.worker", "--concurrency", "${WORKER_CONCURRENCY:-4}"]

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-8080}:80"

volumes:
  pgdata:
    name: blesser_pgdata
