<!-- @dsCard group="Chat" height=230 subtitle="Chat input with context chips, attachments, mode and send" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Composer preview</title>
<link rel="stylesheet" href="../app-patterns.css">
<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
.w{max-width:620px}
</style>
</head>
<body class="g-root">
<div class="w"><div class="g-composer">
  <div class="g-composer__chips">
    <button class="g-chip" aria-label="Remove page context"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg><span>Matches</span><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <button class="g-chip" aria-label="Remove selection"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span>Guanya Shi</span><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <span class="g-chip g-chip--queued"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Then draft an email to her</span><button class="g-chip__btn" aria-label="Send now"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button><button class="g-chip__btn" aria-label="Remove"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span>
  </div>
  <div class="g-composer__chips"><span class="g-attach"><span class="g-attach__thumb"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></span><span class="g-attach__name">CV-2026.pdf</span><button class="g-chip__btn" aria-label="Remove attachment"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span></div>
  <textarea class="g-composer__input" rows="2" placeholder="Ask Gradis" aria-label="Ask Gradis">Why is she the best fit?</textarea>
  <div class="g-composer__bar">
    <button class="g-iconbtn" aria-label="Attach files"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
    <button class="g-composer__mode"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>Agent<svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <span class="g-composer__end">
      <button class="g-ring" aria-label="34% of context used"><svg viewBox="0 0 28 28" aria-hidden="true"><circle class="g-ring__track" cx="14" cy="14" r="10"/><circle class="g-ring__value" cx="14" cy="14" r="10" stroke-dasharray="21.4 62.83"/></svg></button>
      <button class="g-composer__mode">Claude Sonnet<svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="g-send" aria-label="Send"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
    </span>
  </div>
</div></div>
</body>
</html>
