<!-- @dsCard group="Overlays" height=300 subtitle="Pickers: options in an anchored panel, a sheet on phones" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popover preview</title>
<link rel="stylesheet" href="../app-patterns.css">
<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
.r{display:flex;gap:24px;align-items:flex-start}.c{display:flex;flex-direction:column;gap:8px}.p{display:flex;gap:6px}
</style>
</head>
<body class="g-root">
<div class="r">
<div class="c">
  <div class="p"><button class="g-controlpill" aria-expanded="true" aria-label="Run options"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></svg><span>PhD, 3 regions, Robotics</span></button><button class="g-controlpill"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/></svg><span>Use statement</span></button></div>
  <div class="g-popover" role="dialog" aria-label="Degree">
    <button class="g-option" role="radio" aria-checked="true"><span class="g-option__box"></span><span>PhD<span class="g-option__hint">Research degree, usually funded</span></span></button>
    <button class="g-option" role="radio" aria-checked="false" data-active><span class="g-option__box"></span><span>Master's<span class="g-option__hint">Taught or research</span></span></button>
    <button class="g-option" role="radio" aria-checked="false"><span class="g-option__box"></span><span>Either</span></button>
  </div>
</div>
<div class="g-popover" role="dialog" aria-label="Regions" style="margin-top:36px">
  <button class="g-option" role="checkbox" aria-checked="true"><span class="g-option__box"></span><span>United States</span></button>
  <button class="g-option" role="checkbox" aria-checked="true"><span class="g-option__box"></span><span>United Kingdom</span></button>
  <button class="g-option" role="checkbox" aria-checked="false"><span class="g-option__box"></span><span>Germany</span></button>
  <button class="g-option" role="checkbox" aria-checked="true"><span class="g-option__box"></span><span>Switzerland</span></button>
</div>
</div>
</body>
</html>
