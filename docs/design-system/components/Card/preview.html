<!-- @dsCard group="Content" height=230 subtitle="Panels: a bordered block of related settings or facts" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card preview</title>
<link rel="stylesheet" href="../app-patterns.css">
<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
body{background:var(--surface)}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:760px}
.h{margin:0;font:600 14px/20px var(--font-sans)}.m{margin:4px 0 0;font:400 12px/18px var(--font-sans);color:var(--label-secondary)}
.n{margin:12px 0 4px;font:600 24px/30px var(--font-sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
</style>
</head>
<body class="g-root">
<div class="g">
  <section class="g-panel"><h3 class="h">This month</h3><p class="m">Tokens across runs and chats.</p><p class="n">1.2M</p><span class="g-progress" style="display:block"><span style="width:38%"></span></span><p class="m">38% of your plan's allowance</p></section>
  <section class="g-panel"><h3 class="h">Research flow</h3><p class="m">Discover programmes, research faculty, draft email.</p><div style="display:flex;gap:6px;margin-top:12px"><span class="g-tag">3 steps</span><span class="g-tag">Default</span></div></section>
</div>
</body>
</html>
