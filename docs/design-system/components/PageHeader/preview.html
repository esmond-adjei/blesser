<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PageHeader preview</title>
<link rel="stylesheet" href="../app-patterns.css">
<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
body{background:var(--surface)}.h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;max-width:1000px}
.h h1{margin:0;font:600 28px/34px var(--font-sans);letter-spacing:-.022em}.c{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.badge{position:absolute;top:-6px;right:-6px;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--tint);color:var(--on-tint);font:600 12px/1 var(--font-sans)}
</style>
</head>
<body class="g-root">
<header class="h">
  <h1>Matches</h1>
  <div class="c">
    <label class="g-search" style="width:240px"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input placeholder="Search matches" aria-label="Search matches" style="font-size:14px"></label>
    <div class="g-seg" role="group" aria-label="View type"><button aria-pressed="true" aria-label="List"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></svg></button><button aria-pressed="false" aria-label="Grid"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></button></div>
    <button class="g-btn g-btn--outline g-btn--sm"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>Best fit</button>
    <button class="g-btn g-btn--outline g-btn--sm" style="position:relative"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></svg>Filters<span class="badge" aria-label="1 active filter">1</span></button>
  </div>
</header>
</body>
</html>
