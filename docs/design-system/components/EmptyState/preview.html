<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EmptyState preview</title>
<link rel="stylesheet" href="../app-patterns.css">
<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
body{background:var(--canvas)}.g{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:880px}
.w{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--elevation-1)}
.w .g-empty .g-btn{margin-top:0}
</style>
</head>
<body class="g-root">
<div class="g">
<div class="w"><div class="g-empty">
  <img src="/_blob/e35a4a27277b0f21c1985c32042fe0f6" alt="Gradis searching with a magnifying glass">
  <p class="g-empty__title">Outbox is empty</p>
  <p class="g-empty__body">Request a draft from any scored candidate. Drafts are never sent.</p>
  <div style="margin-top:8px"><button class="g-btn g-btn--outline g-btn--sm">Browse matches</button></div>
</div></div>
<div class="w"><div class="g-empty">
  <span class="g-icon-tile" style="width:48px;height:48px;border-radius:var(--radius-md)"><svg class="g-icon g-icon--24" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span>
  <p class="g-empty__title">Couldn't load drafts</p>
  <p class="g-empty__body">Check your connection, then try again.</p>
  <div style="margin-top:8px"><button class="g-btn g-btn--outline g-btn--sm"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>Try again</button></div>
</div></div>
</div>
</body>
</html>
