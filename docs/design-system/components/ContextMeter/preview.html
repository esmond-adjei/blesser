<!-- @dsCard group="Chat" height=190 subtitle="How full the model's context is: ring, then the bar on click" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ContextMeter preview</title>
<link rel="stylesheet" href="../app-patterns.css">
<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
.r{display:flex;gap:24px;align-items:flex-start}.c{display:flex;gap:4px;align-items:center}
.b{width:256px;padding:8px;display:grid;gap:12px;font:400 14px/20px var(--font-sans)}.b p{margin:0}
.l{display:flex;justify-content:space-between;font:400 12px/16px var(--font-sans);color:var(--label-secondary);font-variant-numeric:tabular-nums;margin-top:6px}
.cap{font:500 12px/16px var(--font-sans);color:var(--label-secondary)}
</style>
</head>
<body class="g-root">
<div class="r">
  <div class="c">
    <button class="g-ring" aria-label="34% of context used"><svg viewBox="0 0 28 28" aria-hidden="true"><circle class="g-ring__track" cx="14" cy="14" r="10"/><circle class="g-ring__value" cx="14" cy="14" r="10" stroke-dasharray="21.4 62.83"/></svg></button>
    <button class="g-ring" data-full aria-label="93% of context used"><svg viewBox="0 0 28 28" aria-hidden="true"><circle class="g-ring__track" cx="14" cy="14" r="10"/><circle class="g-ring__value" cx="14" cy="14" r="10" stroke-dasharray="58.4 62.83"/></svg></button>
  </div>
  <div class="g-popover" style="width:auto">
    <div class="b">
      <p style="font-weight:500">claude-sonnet-4-5</p>
      <div><span class="g-meter" role="meter" aria-label="Context used" aria-valuenow="68000" aria-valuemin="0" aria-valuemax="200000"><span style="width:34%"></span></span>
      <div class="l"><span>68,000 / 200,000 tokens</span><span>34%</span></div></div>
      <p class="cap">Token counts between replies are estimates. This measures context, not billing.</p>
    </div>
  </div>
</div>
</body>
</html>
