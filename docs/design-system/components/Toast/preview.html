<!-- @dsCard group="Overlays" height=150 subtitle="Brief confirmation of something that happened" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toast preview</title>
<link rel="stylesheet" href="../app-patterns.css">
<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
.c{display:grid;gap:10px}
</style>
</head>
<body class="g-root">
<div class="c">
  <div class="g-toast" role="status"><svg class="g-icon g-icon--20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><div><div class="g-toast__title">Draft approved</div><div class="g-secondary" style="font-size:13px;line-height:18px">Copy it from the Outbox to send.</div></div><button class="g-iconbtn" style="margin-left:auto" aria-label="Close"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  <div class="g-toast g-toast--critical" role="alert"><svg class="g-icon g-icon--20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg><div><div class="g-toast__title">Couldn't save the CV</div><div class="g-secondary" style="font-size:13px;line-height:18px">You're offline. We'll retry.</div></div><button class="g-iconbtn" style="margin-left:auto" aria-label="Close"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
</div>
</body>
</html>
