<!-- @dsCard group="Inputs" height=210 subtitle="On, off and mixed, at the end of a setting row" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/bundle.css"><link rel="stylesheet" href="../components/app-patterns.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"light"</script>
<meta charset="utf-8">
<title>Switch preview</title>

<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
.p{max-width:460px;padding:0 20px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:16px 0}.row+.row{border-top:1px solid var(--separator)}.t{font:500 14px/20px var(--font-sans)}.s{margin-top:4px;font:400 12px/18px var(--font-sans);color:var(--label-secondary)}
</style>
</head>
<body class="g-root">
<div class="g-panel p">
<div class="row"><div><div class="t">Email me when a run finishes</div><div class="s">One email per run, never more.</div></div><button class="g-switch" role="switch" aria-checked="true" aria-label="Email me when a run finishes"></button></div>
<div class="row"><div><div class="t">Deadline reminders</div><div class="s">Seven and two days before.</div></div><button class="g-switch" role="switch" aria-checked="false" aria-label="Deadline reminders"></button></div>
<div class="row"><div><div class="t">Research steps</div><div class="s">Some steps in this flow are off.</div></div><button class="g-switch" role="switch" aria-checked="mixed" aria-label="Research steps"></button></div>
</div>
</body>
</html>
