<!doctype html>

<head><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"light"</script>

body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:640px}
.rc{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-lg);box-shadow:var(--elevation-1);color:var(--label);text-decoration:none}
.rc .k{display:block;font:500 12px/16px var(--font-sans)}.rc .n{display:block;font:600 14px/20px var(--font-sans)}.rc .g-chev{margin-left:auto;color:var(--label-tertiary)}
.rc .g-icon-tile{width:32px;height:32px}
.prof{background:rgba(240,253,250,.7)}.prof .g-icon-tile{background:#f0fdfa;border-radius:50%}.prof :is(.k,.g-icon-tile){color:#0f766e}
.prog{background:rgba(239,246,255,.7)}.prog .g-icon-tile{background:#eff6ff}.prog :is(.k,.g-icon-tile){color:#1d4ed8}
.appl{background:rgba(236,253,245,.7)}.appl .g-icon-tile{background:#ecfdf5}.appl :is(.k,.g-icon-tile){color:#047857}
.drft{background:rgba(240,249,255,.7)}.drft .g-icon-tile{background:#f0f9ff}.drft :is(.k,.g-icon-tile){color:#0369a1}
[data-theme=dark] .prof{background:rgba(4,47,46,.4)}[data-theme=dark] .prof .g-icon-tile{background:rgba(4,47,46,.5)}[data-theme=dark] .prof :is(.k,.g-icon-tile){color:#5eead4}
[data-theme=dark] .prog{background:rgba(23,37,84,.4)}[data-theme=dark] .prog .g-icon-tile{background:rgba(23,37,84,.5)}[data-theme=dark] .prog :is(.k,.g-icon-tile){color:#93c5fd}
[data-theme=dark] .appl{background:rgba(2,44,34,.4)}[data-theme=dark] .appl .g-icon-tile{background:rgba(2,44,34,.5)}[data-theme=dark] .appl :is(.k,.g-icon-tile){color:#6ee7b7}
[data-theme=dark] .drft{background:rgba(8,47,73,.4)}[data-theme=dark] .drft .g-icon-tile{background:rgba(8,47,73,.5)}[data-theme=dark] .drft :is(.k,.g-icon-tile){color:#7dd3fc}
.chips{display:grid;gap:8px;max-width:316px;margin-top:16px}.g-record .g-chev{margin-left:auto;color:var(--gold-ink)}
</style>
</head>
