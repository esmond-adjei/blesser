<!-- @dsCard group="Chat" height=300 subtitle="Prompt bubble, answer, and the actions that appear on hover" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/bundle.css"><link rel="stylesheet" href="../components/app-patterns.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"light"</script>
<meta charset="utf-8">
<title>ChatMessage preview</title>

<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
.w{max-width:620px;display:grid;gap:16px;font:400 14px/20px var(--font-sans)}.w p{margin:0;line-height:1.6}
</style>
</head>
<body class="g-root">
<div class="w">
  <div class="g-msg g-msg--user">
    <ul class="g-composer__chips" style="padding:0 0 4px;margin:0;list-style:none"><li class="g-chip"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span>Guanya Shi</span></li></ul>
    <div class="g-bubble">Why is she the best fit?</div>
    <div class="g-msg__actions" data-shown><time class="g-msg__meta">2 min ago</time><button class="g-iconbtn" aria-label="Copy prompt"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button><button class="g-iconbtn" aria-label="Edit prompt"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button></div>
  </div>
  <div class="g-msg">
    <p>Four of her last six papers are on learned legged locomotion, your first interest, and her lab is recruiting PhD students for 2027.</p>
    <div class="g-msg__actions" data-shown><button class="g-iconbtn" aria-label="Copy response as Markdown"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button><button class="g-iconbtn" aria-label="Regenerate response"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button><span class="g-msg__meta">claude-sonnet-4-5</span><time class="g-msg__meta">just now</time></div>
  </div>
  <div class="g-msg"><span class="g-typing" aria-label="Writing" style="color:var(--label-secondary)"><i></i><i></i><i></i></span></div>
</div>
</body>
</html>
