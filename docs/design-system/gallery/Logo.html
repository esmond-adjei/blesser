<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"light"</script>
<meta charset="utf-8">
<title>Logo preview</title>
<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
.r{display:flex;gap:40px;align-items:center;flex-wrap:wrap}.lock{display:flex;align-items:center;gap:12px;font:600 28px/1 var(--font-sans);letter-spacing:-0.03em}.lock img{width:48px;height:48px}.tile{width:112px;height:112px;border-radius:26px;overflow:hidden;background:var(--brand);padding:14px;box-sizing:border-box}.tile img{width:100%;height:100%;display:block}.m img{width:64px;height:64px}
</style>
</head>
<body class="g-root">
<div class="r">
  <div class="lock"><img class="g-logo-l" src="../assets/logos/logo-dark.svg" alt="Graduator"><img class="g-logo-d" src="../assets/logos/logo-light.svg" alt="Graduator">Graduator</div>
  <div class="m"><img class="g-logo-l" src="../assets/logos/logo-dark.svg" alt="Graduator"><img class="g-logo-d" src="../assets/logos/logo-light.svg" alt="Graduator"></div>
  <div class="tile"><img src="../assets/logos/logo-on-navy.png" alt="Graduator app icon on navy"></div>
</div>
</body>
</html>
