<!-- @dsCard group="Inputs" height=150 subtitle="In-page search, and the sidebar's workspace search" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"light"</script>
<meta charset="utf-8">
<title>SearchField preview</title>
<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
.g{display:grid;gap:16px;max-width:420px}
.s{display:flex;align-items:center;gap:10px;width:240px;padding:8px 12px;border:0;border-radius:var(--radius-md);background:var(--fill-quiet);color:var(--label-secondary);font:400 14px/20px var(--font-sans)}
.s .g-kbd{margin-left:auto}
</style>
</head>
<body class="g-root">
<div class="g">
  <label class="g-search"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input placeholder="Search schools" aria-label="Search schools" style="font-size:14px"></label>
  <button class="s"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Search<span class="g-kbd">Ctrl K</span></button>
</div>
</body>
</html>
