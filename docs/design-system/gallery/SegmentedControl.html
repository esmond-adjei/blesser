<!-- @dsCard group="Actions" height=120 subtitle="Views, filters and tabs in one control" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"light"</script>
<meta charset="utf-8">
<title>SegmentedControl preview</title>
<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
.r{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body class="g-root">
<div class="r">
  <div class="g-seg" role="tablist">
    <button role="tab" aria-selected="true">Candidates</button>
    <button role="tab" aria-selected="false">Tasks</button>
    <button role="tab" aria-selected="false">Usage</button>
  </div>
  <div class="g-seg" role="group" aria-label="View">
    <button aria-pressed="true" aria-label="List"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></svg></button>
    <button aria-pressed="false" aria-label="Grid"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></button>
  </div>
  <div class="g-seg" role="group" aria-label="Range">
    <button aria-pressed="false">7 days</button>
    <button aria-pressed="true">30 days</button>
    <button aria-pressed="false">All</button>
  </div>
</div>
</body>
</html>
