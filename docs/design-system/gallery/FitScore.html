<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"light"</script>
<meta charset="utf-8">
<title>FitScore preview</title>
<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
.c{display:grid;gap:14px}
</style>
</head>
<body class="g-root">
<div class="c">
  <span class="g-fit" data-band="strong"><span class="g-fit__track"><span class="g-fit__bar" style="width:91%"></span></span><span class="g-fit__value">91%</span></span>
  <span class="g-fit" data-band="moderate"><span class="g-fit__track"><span class="g-fit__bar" style="width:38%"></span></span><span class="g-fit__value">38%</span></span>
  <span class="g-fit" data-band="weak"><span class="g-fit__track"><span class="g-fit__bar" style="width:18%"></span></span><span class="g-fit__value">18%</span></span>
  <span class="g-fit g-fit--lg" data-band="strong"><span class="g-fit__track"><span class="g-fit__bar" style="width:91%"></span></span><span class="g-fit__value">91%</span><span class="g-fit__band">Strong fit</span></span>
</div>
</body>
</html>
