<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"light"</script>
<meta charset="utf-8">
<title>FeatureTile preview</title>
<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
body{background:var(--canvas)}.b{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
</style>
</head>
<body class="g-root">
<div class="b">
  <div class="g-tile"><span class="g-eyebrow" style="font-size:15px">Dossier</span><h3 class="g-tile__title">Every professor, ranked by what they actually publish.</h3><p class="g-tile__body">Scores come from the papers, not a model's guess. Open any match to see the four papers that earned it.</p><div style="margin-top:12px"><span class="g-fit g-fit--lg" data-band="strong"><span class="g-fit__track"><span class="g-fit__bar" style="width:91%"></span></span><span class="g-fit__value">91%</span><span class="g-fit__band">Strong fit</span></span></div></div>
  <div class="g-tile g-tile--brand"><span class="g-eyebrow" style="font-size:15px;color:var(--gold)">Outbox</span><h3 class="g-tile__title">Nothing is ever sent for you.</h3><p class="g-tile__body">Every draft waits for your approval. Edit it, copy it, send it yourself.</p></div>
</div>
</body>
</html>
