<!-- @dsCard group="Actions" height=200 subtitle="Primary, secondary, outline, plain, destructive; sm to xl" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/bundle.css"><link rel="stylesheet" href="../components/app-patterns.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"light"</script>
<meta charset="utf-8">
<title>Button preview</title>

<style>
body{margin:0;padding:24px;}
.g-logo-d{display:none}[data-theme='dark'] .g-logo-l{display:none}[data-theme='dark'] .g-logo-d{display:inline-block}
.r{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
</style>
</head>
<body class="g-root">
<div class="r">
  <button class="g-btn g-btn--primary"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New run</button>
  <button class="g-btn g-btn--secondary">Tailor CV</button>
  <button class="g-btn g-btn--outline">Cancel</button>
  <button class="g-btn g-btn--plain">Show all</button>
  <button class="g-btn g-btn--destructive"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>Delete run</button>
</div>
<div class="r">
  <button class="g-btn g-btn--outline g-btn--sm"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>Best fit</button>
  <button class="g-btn g-btn--outline g-btn--sm"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></svg>Filters</button>
  <button class="g-btn g-btn--outline g-btn--sm"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>Try again</button>
  <button class="g-btn g-btn--outline g-btn--icon" aria-label="More actions"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
  <button class="g-btn g-btn--primary" disabled>Saving</button>
</div>
<div class="r">
  <button class="g-btn g-btn--primary g-btn--capsule" style="width:240px"><svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New run</button>
  <button class="g-btn g-btn--primary g-btn--xl">Start your search</button>
</div>
</body>
</html>
