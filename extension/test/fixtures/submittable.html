<!doctype html>
<html><body>
<form id="submission-form" class="form-builder">
  <fieldset>
    <legend>About your organisation</legend>
    <div class="form-group">
      <label for="f-org">Organisation name <abbr title="required">*</abbr></label>
      <input id="f-org" name="field_101" type="text" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="f-reg">Registration number</label>
      <input id="f-reg" name="field_102" type="text" class="form-control">
    </div>
    <div class="form-group">
      <label for="f-founded">Year founded</label>
      <input id="f-founded" name="field_103" type="number" class="form-control">
    </div>
  </fieldset>
  <fieldset>
    <legend>Project narrative</legend>
    <div class="form-group">
      <div id="narr-label" class="control-label">Project summary *</div>
      <div id="narr-help" class="help-block">Describe the project in no more than 250 words.</div>
      <div class="rich-text-editor">
        <div id="f-narr" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="narr-label" aria-describedby="narr-help" class="ql-editor"><p><br></p></div>
      </div>
    </div>
    <div class="form-group">
      <label for="f-amount">Amount requested (USD)</label>
      <input id="f-amount" name="field_105" type="number" class="form-control">
    </div>
    <div class="form-group">
      <label for="f-budget">Budget</label>
      <input id="f-budget" name="field_106" type="file" accept=".xlsx,.xls,.csv,.pdf" class="form-control">
    </div>
  </fieldset>
  <fieldset>
    <legend>Payment</legend>
    <div class="form-group">
      <label for="cc">Card number</label>
      <input id="cc" name="cc" type="text" autocomplete="cc-number">
    </div>
    <div class="form-group">
      <label for="iban">IBAN for grant disbursement</label>
      <input id="iban" name="iban" type="text">
    </div>
  </fieldset>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</body></html>
