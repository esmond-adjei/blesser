<!doctype html>
<html><body>
<form method="POST" enctype="multipart/form-data" id="application-form">
  <div class="section-wrapper page-full-width">
    <div class="section application-form">
      <h4>Submit your application</h4>
      <ul>
        <li class="application-question resume">
          <label>
            <div class="application-label">Resume/CV<span class="required">✱</span></div>
            <div class="application-field">
              <a class="visible-resume-upload"><span class="default-label">ATTACH RESUME/CV</span></a>
              <input type="file" id="resume-upload-input" name="resume" class="invisible-resume-upload" style="opacity:0">
            </div>
          </label>
        </li>
        <li class="application-question custom-question">
          <label>
            <div class="application-label">Full name<span class="required">✱</span></div>
            <div class="application-field"><input type="text" name="name" required data-qa="name-input"></div>
          </label>
        </li>
        <li class="application-question">
          <label>
            <div class="application-label">Email<span class="required">✱</span></div>
            <div class="application-field"><input type="email" name="email" required></div>
          </label>
        </li>
        <li class="application-question">
          <label>
            <div class="application-label">Current company</div>
            <div class="application-field"><input type="text" name="org"></div>
          </label>
        </li>
      </ul>
    </div>
    <div class="section application-form">
      <h4>Links</h4>
      <ul>
        <li class="application-question">
          <label>
            <div class="application-label">LinkedIn URL</div>
            <div class="application-field"><input type="text" name="urls[LinkedIn]"></div>
          </label>
        </li>
      </ul>
    </div>
    <div class="section application-additional">
      <h4>Additional information</h4>
      <div class="application-question">
        <div class="application-label">Tell us about a project you are proud of<span class="required">✱</span></div>
        <div class="application-description">Keep it under 200 words.</div>
        <div class="application-field"><textarea name="cards[a1b2][field0]" required></textarea></div>
      </div>
      <div class="application-question">
        <div class="application-label">Will you need visa sponsorship?</div>
        <ul data-qa="multiple-choice">
          <li><label><input type="radio" name="cards[a1b2][field1]" value="Yes"><span class="application-answer-alternative">Yes</span></label></li>
          <li><label><input type="radio" name="cards[a1b2][field1]" value="No"><span class="application-answer-alternative">No</span></label></li>
        </ul>
      </div>
    </div>
  </div>
  <button type="submit" class="template-btn-submit">Submit application</button>
</form>
</body></html>
